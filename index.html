<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZOO 氣象台：樹懶慢慢報</title>

    <!-- 主視覺 Icon：樹懶抱雲 -->
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="logo.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --zoo-green: #8cd8a1;
            --zoo-leaf: #7bc28c;
            --zoo-cloud: #ffffff;
            --zoo-brown: #6b5646;
            --zoo-orange: #ffb86c;
            --zoo-blue: #5ec8f2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: var(--zoo-green);
            background-image:
                repeating-linear-gradient(45deg,
                    rgba(255, 255, 255, 0.15) 0px,
                    rgba(255, 255, 255, 0.15) 10px,
                    rgba(0, 0, 0, 0.03) 10px,
                    rgba(0, 0, 0, 0.03) 20px);
            min-height: 100vh;
            color: var(--zoo-brown);
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* 標題區（像 Zootopia 城市牌） */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.35);
            border-bottom: 2px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .location-pill {
            background: var(--zoo-orange);
            padding: 6px 18px;
            border-radius: 20px;
            color: var(--zoo-brown);
            font-weight: 900;
            transform: rotate(-3deg);
            border: 2px solid white;
        }

        .update-pill {
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            padding: 4px 12px;
            border-radius: 14px;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 今日主卡片 */
        .hero-card {
            background: var(--zoo-leaf);
            border-radius: 40px;
            padding: 30px 25px;
            text-align: center;
            border: 5px solid var(--zoo-cloud);
            color: white;
            margin-bottom: 30px;
            position: relative;
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.15);
        }

        .hero-period {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--zoo-blue);
            padding: 6px 22px;
            border-radius: 22px;
            font-weight: 900;
            border: 3px solid white;
        }

        .hero-temp-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 15px 0;
        }

        .hero-icon {
            font-size: 5.5rem;
            animation: bounce 3s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .hero-temp {
            font-size: 4.5rem;
            font-weight: 900;
            line-height: 1;
        }

        .hero-desc {
            font-size: 1.4rem;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        /* 建議卡片 */
        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
            padding-top: 20px;
            border-top: 2px dashed rgba(255, 255, 255, 0.5);
        }

        .advice-item {
            background: rgba(255, 255, 255, 0.8);
            padding: 12px;
            border-radius: 20px;
            color: var(--zoo-brown);
            text-align: center;
        }

        .advice-icon {
            font-size: 2rem;
        }

        .advice-text {
            font-size: 1.2rem;
            font-weight: 900;
        }

        /* 稍後預報 */
        .section-title {
            font-size: 1.2rem;
            font-weight: 900;
            margin-bottom: 15px;
            margin-left: 10px;
            color: white;
        }

        .scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
            scrollbar-width: none;
        }

        .scroll-container::-webkit-scrollbar {
            display: none;
        }

        .mini-card {
            min-width: 140px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            padding: 18px 15px;
            border: 3px solid white;
            text-align: center;
            flex-shrink: 0;
        }

        .mini-time {
            background: var(--zoo-green);
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .mini-icon {
            font-size: 2.5rem;
        }

        .mini-temp {
            font-size: 1.2rem;
            font-weight: 800;
            margin-top: 5px;
            color: var(--zoo-brown);
        }

        /* Loading 畫面 */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--zoo-green);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .loading-icon {
            font-size: 4rem;
            animation: bounce 2.5s infinite;
        }
    </style>
</head>

<body>
    <!-- Loading -->
    <div id="loading" class="loading-screen">
        <div class="loading-icon">🦥</div>
        <p style="color:white; font-weight:900; margin-top:20px; font-size:1.2rem;">
            樹懶 Flash 正在努力加速中…（但看起來不太快）
        </p>
    </div>

    <!-- Header -->
    <div class="status-bar">
        <div class="location-pill">🐾 動物城・台中分局</div>
        <div id="updateTime" class="update-pill">更新中...</div>
    </div>

    <div class="container" id="mainContent" style="display:none;">

        <div id="heroCard"></div>

        <h3 class="section-title">稍後預報（樹懶慢慢推送中）</h3>
        <div class="scroll-container" id="futureForecasts"></div>
    </div>

    <script>
        const API_URL = "https://weather-taichill.zeabur.app/api/weather/taichung";

        function getWeatherIcon(weather) {
            if (!weather) return "🌤️";
            if (weather.includes("晴")) return "☀️";
            if (weather.includes("多雲")) return "⛅";
            if (weather.includes("陰")) return "☁️";
            if (weather.includes("雨")) return "🌧️";
            if (weather.includes("雷")) return "⛈️";
            return "🌤️";
        }

        function getAdvice(rainProb, maxTemp) {
            let rainIcon = "🌂";
            let rainText = "今天安全，不太會淋濕～";

            if (parseInt(rainProb) > 30) {
                rainIcon = "☂️";
                rainText = "樹懶提醒：不想濕答答就帶傘喔～";
            }

            let clothIcon = "👕";
            let clothText = "氣溫剛剛好，舒服～";

            if (parseInt(maxTemp) >= 28) {
                clothIcon = "🎽";
                clothText = "兔子 Judy 說：短袖開跑！";
            } else if (parseInt(maxTemp) <= 20) {
                clothIcon = "🧥";
                clothText = "樹懶建議：加件外套暖暖的～";
            }

            return { rainIcon, rainText, clothIcon, clothText };
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 5 && hour < 11) return "早晨";
            if (hour >= 11 && hour < 14) return "中午";
            if (hour >= 14 && hour < 18) return "下午";
            if (hour >= 18 && hour < 23) return "晚上";
            return "深夜";
        }

        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            const advice = getAdvice(current.rain, current.maxTemp);
            const period = getTimePeriod(current.startTime);
            const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

            /* 主卡片 */
            document.getElementById('heroCard').innerHTML = `
                <div class="hero-card">
                    <div class="hero-period">🐾 ${period}・森林都市氣象局</div>

                    <div class="hero-temp-container">
                        <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
                        <div class="hero-temp">${avgTemp}°</div>
                    </div>

                    <div class="hero-desc">
                        ${
                            current.weather.includes("雨")
                            ? "今天下的不是雨，是樹懶的速度淚 ☔"
                            : current.weather.includes("晴")
                            ? "陽光像 Judy 一樣元氣滿滿 ☀️"
                            : "雲朵正在思考人生中… ☁️"
                        }
                    </div>

                    <div class="advice-grid">
                        <div class="advice-item">
                            <div class="advice-icon">${advice.rainIcon}</div>
                            <div class="advice-text">${advice.rainText}</div>
                            <div style="font-size:0.7rem; color:#666">降雨率 ${current.rain}</div>
                        </div>

                        <div class="advice-item">
                            <div class="advice-icon">${advice.clothIcon}</div>
                            <div class="advice-text">${advice.clothText}</div>
                            <div style="font-size:0.7rem; color:#666">最高溫 ${current.maxTemp}°</div>
                        </div>
                    </div>
                </div>
            `;

            /* 稍後預報 */
            const scrollContainer = document.getElementById('futureForecasts');
            scrollContainer.innerHTML = '';

            const todayDate = new Date().getDate();

            others.forEach(f => {
                let p = getTimePeriod(f.startTime);
                const fDate = new Date(f.startTime);

                if (fDate.getDate() !== todayDate) p = "明天" + p;

                scrollContainer.innerHTML += `
                    <div class="mini-card">
                        <div class="mini-time">🐾 ${p}（樹懶預測）</div>
                        <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
                        <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                        <div style="font-size:0.8rem; color:#888; margin-top:5px;">💧${f.rain}</div>
                    </div>
                `;
            });

            /* 更新時間顯示 */
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayIndex = now.getDay();
            const days = ["週日","週一","週二","週三","週四","週五","週六"];

            document.getElementById('updateTime').textContent = `${month}月${date}日 ${days[dayIndex]}`;

            /* 顯示主內容、隱藏 loading */
            document.getElementById('loading').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        async function fetchWeather() {
            try {
                const delay = new Promise(res => setTimeout(res, 1500));
                const data = fetch(API_URL).then(res => res.json());
                const [_, json] = await Promise.all([delay, data]);

                if (!json.success) throw new Error("API Error");
                renderWeather(json.data);

            } catch (e) {
                console.error(e);
                alert("天氣資料讀取失敗，樹懶可能不小心按錯按鈕了！");
            }
        }

        document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>

</body>
</html>
